<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Village Grievance Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<header>
<h1>Village Grievance Management</h1>
<p>Dummy frontend for testing the Spring Boot backend</p>
</header>
<div id="message" class="message hidden"></div>

<section id="loginSection" class="card">
<h2>Login</h2>
<div class="grid">
<label>Mobile Number<input id="mobileNumber" placeholder="9000000001"></label>
<label>Password<input id="password" type="password"></label>
</div>
<button onclick="login()">Login</button>
</section>

<section id="appSection" class="hidden">
<div class="card userbar">
<div><strong id="userName"></strong> <span id="userRole" class="badge"></span></div>
<button class="danger" onclick="logout()">Logout</button>
</div>

<section id="citizenSection" class="hidden">
<div class="card">
<h2>Submit Complaint</h2>
<div class="grid">
<label>Problem Type
<select id="problemType">
<option>Water</option><option>Roads</option><option>Street Lights</option>
<option>Garbage/Sanitation</option><option>Drainage</option><option>Electricity</option>
<option>Government Services</option><option>Other</option>
</select></label>
<label>Location<input id="location" placeholder="Problem location"></label>
</div>
<label>Description<textarea id="description"></textarea></label>
<button onclick="submitComplaint()">Submit Complaint</button>
</div>
<div class="card">
<div class="section-title"><h2>My Complaints</h2><button class="secondary" onclick="loadCitizenComplaints()">Refresh</button></div>
<div id="citizenComplaints"></div>
</div>
<div class="card">
<div class="section-title"><h2>My Notifications</h2><button class="secondary" onclick="loadNotifications()">Refresh</button></div>
<div id="notifications"></div>
</div>
</section>

<section id="sarpanchSection" class="hidden">
<div class="card">
<div class="section-title"><h2>Village Complaints</h2><button class="secondary" onclick="loadSarpanchComplaints()">Refresh</button></div>
<div id="sarpanchComplaints"></div>
</div>
</section>

<section id="secretarySection" class="hidden">
<div class="card">
<div class="section-title"><h2>Monitor Village Complaints</h2><button class="secondary" onclick="loadSecretaryComplaints()">Refresh</button></div>
<div id="secretaryComplaints"></div>
</div>
</section>
</section>
</div>
<script src="js/app.js"></script>
</body>
</html>
